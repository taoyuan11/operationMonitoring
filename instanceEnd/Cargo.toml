[package]
name = "instanceEnd"
version = "0.1.26"
edition = "2024"
rust-version = "1.89"

[profile.dev]
# Line tables retain useful debugger locations while avoiding the larger full
# debug information set on small development hosts.
debug = 1

[profile.test]
debug = 1

[[bin]]
name = "om-agent"
path = "src/main.rs"

[features]
default = []
bundled-windows-drivers = []
bundled-windows-test-drivers = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["signature"] }
futures-util = "0.3.34"
fs2 = "0.4.3"
hostname = "0.4.2"
network-interface = "2.0.5"
portable-pty = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.38.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
windows-service = "0.8.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Devices_Enumeration_Pnp",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(all(windows, any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
rusty-opus = "0.9.1"

[build-dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["signature"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[profile.release]
# A single codegen unit plus ThinLTO gives a small runtime win at a substantial
# compile-time and memory cost. Four units keep release builds practical on
# low-memory hosts while retaining full opt-level=3 code generation.
codegen-units = 4
lto = false
panic = "abort"
strip = "symbols"
